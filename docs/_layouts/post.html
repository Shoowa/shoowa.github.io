---
layout: default
---
<small>{{ page.date | date: "%-d %B %Y" }}</small>
<h1>{{ page.title }}</h1>
<small>by {{ site.author.name }}</small>
<br/>
<br/>

{{ content }}

{% if page.tags %}
    {% for tag in page.tags %}
        <a href="{{site.baseurl}}/archive.html#{{tag | slugize}}">#{{ tag }}</a>
    {% endfor %}
{% endif %}
